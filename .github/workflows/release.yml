name: Release candidates
on:
  push:
    branches: [main]
    paths: ['.gitattributes', 'packages/**', 'consumers/ledgerguard/**', 'scripts/ledgerguard-*.mjs', 'tests/ledgerguard-*.test.mjs', 'tools/semantic-release/**', 'package.json', 'package-lock.json', 'pnpm-lock.yaml', 'release.config.mjs', 'scripts/release-*.mjs', 'scripts/package-hardening.mjs', 'tests/release-*.test.mjs', 'tests/compatibility/**', 'tests/hardening/**', 'tests/consumers/**', 'tests/fixtures/release-registry-server.mjs', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Publish the verified set to forgeqa-candidate only; never promote latest
        type: boolean
        default: false
      confirm_source_sha:
        description: Exact current source SHA authorized for candidate publication
        type: string
        default: ''
      confirm_npm_scope:
        description: Confirm npm scope ownership and all eight trusted-publisher associations
        type: boolean
        default: false
permissions: { contents: read, actions: read }
concurrency:
  group: forgeqa-release-candidates-${{ github.ref }}
  cancel-in-progress: false
env:
  FORGEQA_SOURCE_SHA: ${{ github.sha }}
jobs:
  verify-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      release_planned: ${{ steps.prepared.outputs.release_planned }}
      manifest_sha256: ${{ steps.prepared.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 24, package-manager-cache: false }
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run hardening
      - name: Retain only complete tarballs matching the tested source artifacts
        run: node scripts/release-manifest.mjs --dry-run
      - name: Verify all retained source artifact checksums
        working-directory: evidence/release-candidate
        run: sha256sum --check SHA256SUMS
      - name: Require complete exact-source CI and Documentation acceptance
        run: node scripts/release-evidence.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install the matching browser for independent prepared consumers
        run: npx --no-install playwright install --with-deps chromium
      - name: Calculate shared version and verify the final prepared artifacts
        id: prepared
        run: node scripts/release-engine.mjs prepare
      - name: Exercise actual registry publication, interruption recovery and npm/pnpm consumers
        run: node scripts/release-engine.mjs registry-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-candidates-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/release-candidate/
            evidence/release-prepared/
            evidence/hardening/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() && steps.prepared.outputs.release_planned == 'true'
        with:
          name: prepared-release-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/release-prepared/
          if-no-files-found: error
          retention-days: 30
  verify-real-consumers:
    needs: verify-artifacts
    if: needs.verify-artifacts.outputs.release_planned == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      LEDGERGUARD_ROOT: ${{ github.workspace }}/.tmp/ledgerguard
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: forgeqa_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: forgeqa-disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d forgeqa_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - name: Check out the pinned real product consumer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: azerish25-ux/transaction-reliability-lab
          ref: d8d365690d961580d22105feb15ddec3267185ae
          path: .tmp/ledgerguard
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 24, package-manager-cache: false }
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run build --workspace examples/demo-saas
      - run: node scripts/prepare-teamboard-db.mjs
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:forgeqa-disposable-ci-only@127.0.0.1:5432/forgeqa_test
          FORGEQA_ALLOW_DB_SETUP: '1'
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prepared-release-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/release-prepared/
      - name: Qualify real applications through the exact prepared registry packages
        run: node scripts/release-real-consumers.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: real-registry-consumers-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/release-real-consumers/
            evidence/release-prepared/registry-teamboard-consumers/
            evidence/ledgerguard/
            evidence/teamboard-workspace.json
            evidence/teamboard-cleanup.json
          if-no-files-found: error
          retention-days: 30
  publish-candidate:
    needs: [verify-artifacts, verify-real-consumers]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_candidate && needs.verify-artifacts.outputs.release_planned == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions: { contents: read, actions: read, id-token: write }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 24, package-manager-cache: false }
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prepared-release-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/release-prepared/
      - name: Publish only the verified candidate and recheck actual registry consumers
        run: node scripts/release-engine.mjs publish-candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORGEQA_CONFIRM_SOURCE: ${{ inputs.confirm_source_sha }}
          FORGEQA_CONFIRM_NPM_SCOPE: ${{ inputs.confirm_npm_scope }}
          FORGEQA_PREPARED_DIGEST: ${{ needs.verify-artifacts.outputs.manifest_sha256 }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: candidate-publication-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/release-publication/
            evidence/release-prepared/registry-consumers/
          if-no-files-found: warn
          retention-days: 30
