name: Release candidates
on:
  push:
    branches: [main]
    paths: ['scripts/release-*.mjs', 'tests/release-*.test.mjs', '.github/workflows/release.yml']
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: forgeqa-release-candidates-${{ github.ref }}
  cancel-in-progress: false
env:
  FORGEQA_SOURCE_SHA: ${{ github.sha }}
jobs:
  verify-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 24, package-manager-cache: false }
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run hardening
      - name: Retain only complete tarballs matching the tested artifacts
        run: node scripts/release-manifest.mjs --dry-run
      - name: Verify all retained artifact checksums
        working-directory: evidence/release-candidate
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-candidates-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/release-candidate/
            evidence/hardening/
          if-no-files-found: error
          retention-days: 30
