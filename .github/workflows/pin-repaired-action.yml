name: Pin repaired action payload
# Branch-only pin updater; removed after the immutable reference is committed.
on:
  push:
    branches: [feature/github-platform-hardening]
permissions:
  contents: write
jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Pin the exact repaired action distribution
        env:
          OLD_SHA: 72d5016a3247ff4c7c3cc8e2662fa4653d7eebbe
          NEW_SHA: 82d583b8b1b44623643304e24def0ef9c45653bd
        run: python -c "import os; from pathlib import Path; p=Path('.github/workflows/forgeqa-reusable.yml'); s=p.read_text(); old=os.environ['OLD_SHA']; new=os.environ['NEW_SHA']; assert s.count(old)==3, s.count(old); p.write_text(s.replace(old,new))"
      - name: Commit immutable workflow pin
        run: |
          git add .github/workflows/forgeqa-reusable.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(workflow): pin repaired action distribution [skip ci]"
          git push
