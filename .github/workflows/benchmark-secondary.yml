name: ForgeQA supplementary benchmarks
on:
  workflow_call:
    inputs:
      repetitions:
        type: string
        required: true
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORGEQA_SOURCE_SHA: ${{ github.sha }}
      REPETITIONS: ${{ inputs.repetitions }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: forgeqa_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: forgeqa-disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d forgeqa_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: 22, package-manager-cache: false}
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run build --workspace examples/demo-saas
      - run: node scripts/prepare-teamboard-db.mjs
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:forgeqa-disposable-ci-only@127.0.0.1:5432/forgeqa_test
          FORGEQA_ALLOW_DB_SETUP: '1'
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Measure native versus ForgeQA reporter overhead
        run: node benchmarks/reporter-overhead.mjs --repetitions "$REPETITIONS"
      - name: Measure synthetic large-result scaling
        if: always()
        run: node benchmarks/synthetic/result-scaling.mjs --repetitions "$REPETITIONS"
      - name: Verify owned database cleanup independently
        if: always()
        run: node benchmarks/verify-cleanup.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: benchmark-supplementary-${{ github.sha }}
          path: evidence/benchmarks/supplementary/
          if-no-files-found: error
          retention-days: 30
