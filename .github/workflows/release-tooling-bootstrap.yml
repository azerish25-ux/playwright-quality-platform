name: Release tooling bootstrap
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-tooling-bootstrap.yml']
  workflow_dispatch:
permissions: { contents: write }
concurrency:
  group: forgeqa-release-tooling-bootstrap
  cancel-in-progress: false
jobs:
  prepare-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 24, package-manager-cache: false }
      - name: Resolve compatible release tooling into exact dependency locks
        run: |
          npm ci --ignore-scripts
          npm install --save-dev --save-exact --ignore-scripts --no-audit --no-fund semantic-release@24.2.9 @semantic-release/commit-analyzer@13.0.1 @semantic-release/release-notes-generator@14.1.1 conventional-changelog-conventionalcommits@8.0.0
          node node_modules/pnpm/bin/pnpm.cjs install --lockfile-only --ignore-scripts
          npm ls semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator conventional-changelog-conventionalcommits
      - name: Retain source and tooling for local verification without credentials
        run: |
          mkdir -p evidence/tooling
          git bundle create evidence/tooling/source.bundle HEAD --tags
          tar --exclude='./.git' --exclude='./evidence' -czf evidence/tooling/workspace.tgz .
          cd evidence/tooling
          sha256sum source.bundle workspace.tgz > SHA256SUMS
          cat SHA256SUMS
      - name: Store only generated dependency locks as Git blobs without updating refs
        env:
          GH_BLOB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const records = [];
          for (const path of ['package-lock.json', 'pnpm-lock.yaml']) {
            const bytes = await readFile(path);
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {
              method: 'POST', redirect: 'error', signal: AbortSignal.timeout(30000),
              headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${process.env.GH_BLOB_TOKEN}`, 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify({ encoding: 'base64', content: bytes.toString('base64') })
            });
            if (!response.ok) throw new Error(`Dependency blob storage failed: HTTP ${response.status}`);
            const { sha } = await response.json();
            const expected = createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            if (sha !== expected) throw new Error('Dependency Git blob integrity mismatch.');
            records.push({ path, sha, sha256: createHash('sha256').update(bytes).digest('hex') });
          }
          console.log(JSON.stringify({ dependencyBlobs: records }));
          await writeFile('evidence/tooling/dependency-blobs.json', JSON.stringify(records, null, 2));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tooling-${{ github.sha }}
          path: evidence/tooling/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
