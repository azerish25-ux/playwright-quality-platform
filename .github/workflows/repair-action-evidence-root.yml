name: Repair action evidence root
on:
  push:
    branches: [feature/github-platform-hardening]
permissions:
  contents: write
jobs:
  repair:
    # This branch-only bootstrap is removed after it commits the repaired source and compiled payload.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Confine downloaded evidence to validated GITHUB_WORKSPACE
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/github-action/src/main.ts')
          source = path.read_text()
          old = "const evidence = await realpath(resolve(context.workingDirectory, inputs.evidenceDirectory)).catch(() => {"
          new = "const evidence = await realpath(resolve(context.workspace, inputs.evidenceDirectory)).catch(() => {"
          if source.count(old) != 1:
              raise SystemExit('Expected one unpatched evidence-root expression.')
          path.write_text(source.replace(old, new, 1))
          PY
      - run: npm ci --ignore-scripts
      - run: npx --no-install tsc -b packages/github-action
      - name: Commit repaired source and exact distribution
        run: |
          git add packages/github-action/src/main.ts
          git add -f packages/github-action/dist/*.js packages/github-action/dist/*.d.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(action): resolve downloaded evidence from workspace root [skip ci]"
          git push
