name: Verified source delivery
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/source-delivery.yml]
permissions: { contents: read }
jobs:
  assemble:
    if: github.ref == 'refs/heads/main' && github.repository == 'azerish25-ux/playwright-quality-platform'
    permissions: { contents: write }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify data-only payload and create Git objects without moving a branch
        env:
          DELIVERY_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          import {gunzipSync} from 'node:zlib';
          import {writeFileSync} from 'node:fs';
          const repo='azerish25-ux/playwright-quality-platform';
          const expectedBase='c8336b441c7a2915534e74f8f9980bad7aa4c7a1';
          const expectedDigest='7977a753aefd3bbf2c5b769b362b478932d42f6ebb2e0ce3d29674a34273af66';
          const chunks=['e5b560402b51362990e671690ed3ae16641c7561','d42c0467b723a9dc4fe4fa5832d6ec50eb52368a','e685d46ac7d23deb03f6994cbf1c1a247b30c51d','8f33f67f4aab033b50cbeeff30883c360ee8a7a1','a4e05fa1036a733ce7284ba365709ef0fb65ddb9','63f6f4276a3c42be65ab09ca12f8c6248f85410f','13632f2002cfbf83c2b55f36da6059e0e717c683','28252ef75be7adf8ab826770224658aa5d997165','f0cf449dbcae9b6e6251ccc236df089d70d11796','61dbf429370ae7b0da205254236aafdabbf22cc7','66e10d51c2f2b861427c1928e5a075b3d9696e8c','3de90d3155debb9f5d6bc535c493aa62692a8784','4c59823470a8594a52fb761e2cc85308955b4a1b','4229728422020e9a4bcf66ede71b2a85c492ab16','e31594ff81a866a288dde8feece20f08b68ac582','287e3e71cea2d15c7ac288155bf4d84334a4f3fa','c3c69a16d55273a678f91afdbfaecb3d00debe14','56655856c8540a0e5fd66a7e6032ead93f174549','117a44f98d8b6b2d0ffa52b6d631bd49df89f426','43f458eb27eb3d6d37efcb90065a40cd457970eb','eaf35d721127aa7d04b23705ded2c0a5909f70bf','039b3acfd19d3935470ad425f3c85a264eb13b92','5205d1c2dfd969cbe2da4c37cb731d50a117a17a','dcfc3c337841f06d8d1c195a5bb6af8441b7b2b5','142822284972b308fa047b3f7a96591fcd05faa7','6f57afb67aff90393bae99dc329d783c5a78405d'];
          async function api(path,body){const r=await fetch(`https://api.github.com/repos/${repo}/${path}`,{method:body?'POST':'GET',headers:{Authorization:`Bearer ${process.env.DELIVERY_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(30000)});if(!r.ok)throw Error(`GitHub ${r.status} for ${path}: ${(await r.text()).slice(0,2000)}`);return r.json();}
          const buffers=[];
          for(const sha of chunks){const blob=await api(`git/blobs/${sha}`);if(blob.encoding!=='base64')throw Error('Unexpected blob encoding');const b=Buffer.from(blob.content,'base64');const actual=createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');if(actual!==sha)throw Error('Chunk checksum mismatch');buffers.push(b);}
          const compressed=Buffer.concat(buffers);
          if(compressed.length!==75550||createHash('sha256').update(compressed).digest('hex')!==expectedDigest)throw Error('Payload checksum mismatch');
          const payload=JSON.parse(gunzipSync(compressed,{maxOutputLength:1048576}).toString('utf8'));
          if(payload.schemaVersion!==1||payload.base!==expectedBase||!Array.isArray(payload.files)||payload.files.length!==124)throw Error('Payload schema mismatch');
          const parent=process.env.GITHUB_SHA;
          const ref=await api('git/ref/heads/main');
          if(ref.object.sha!==parent)throw Error('main advanced; refusing to overwrite concurrent delivery');
          const commit=await api(`git/commits/${parent}`);
          if(commit.parents.length!==1||commit.parents[0].sha!==expectedBase)throw Error('Unexpected delivery parent');
          const current=await api(`git/trees/${commit.tree.sha}?recursive=1`);
          if(current.truncated)throw Error('Incomplete tree');
          const entries=new Map(current.tree.map(e=>[e.path,e]));const seen=new Set();const tree=[];
          for(const f of payload.files){
            if(typeof f.path!=='string'||f.path.length>240||f.path.includes('\\')||f.path.includes('\0')||f.path.startsWith('/')||f.path.split('/').some(x=>!x||x==='.'||x==='..'||x==='.git')||seen.has(f.path)||f.mode!=='100644')throw Error('Invalid source path');
            seen.add(f.path);
            if((entries.get(f.path)?.sha??null)!==f.before)throw Error(`Concurrent file change: ${f.path}`);
            if(f.content!==null&&(typeof f.content!=='string'||Buffer.byteLength(f.content)>524288))throw Error('Invalid source content');
            tree.push({path:f.path,mode:f.mode,type:'blob',...(f.content===null?{sha:null}:{content:f.content})});
          }
          tree.push({path:'.github/workflows/source-delivery.yml',mode:'100644',type:'blob',sha:null});
          const built=await api('git/trees',{base_tree:commit.tree.sha,tree});
          const candidate=await api('git/commits',{message:payload.message,tree:built.sha,parents:[parent]});
          const receipt={schemaVersion:1,repository:repo,base:expectedBase,parent,commit:candidate.sha,tree:built.sha,payloadSha256:expectedDigest,changedPaths:tree.map(x=>x.path),branchMoved:false};
          writeFileSync('delivery-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-source-delivery-receipt
          path: delivery-receipt.json
          if-no-files-found: error
          retention-days: 7
