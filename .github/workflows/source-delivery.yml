name: Verified source delivery
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/source-delivery.yml]
permissions: { contents: read }
jobs:
  assemble:
    if: github.ref == 'refs/heads/main' && github.repository == 'azerish25-ux/playwright-quality-platform'
    permissions: { contents: write }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify source data and stage blobs only
        env:
          DELIVERY_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          import {gunzipSync} from 'node:zlib';
          import {writeFileSync} from 'node:fs';
          const repo='azerish25-ux/playwright-quality-platform';
          const expectedBase='c8336b441c7a2915534e74f8f9980bad7aa4c7a1';
          const expectedParent='742495d72d648445c231adc8d5871d071cb07fd1';
          const expectedDigest='7977a753aefd3bbf2c5b769b362b478932d42f6ebb2e0ce3d29674a34273af66';
          async function api(path,body){const r=await fetch(`https://api.github.com/repos/${repo}/${path}`,{method:body?'POST':'GET',headers:{Authorization:`Bearer ${process.env.DELIVERY_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(30000)});if(!r.ok)throw Error(`GitHub ${r.status} for ${path}: ${(await r.text()).slice(0,2000)}`);return r.json();}
          async function bytes(sha){const blob=await api(`git/blobs/${sha}`);if(blob.encoding!=='base64')throw Error('Unexpected encoding');const b=Buffer.from(blob.content,'base64');if(createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex')!==sha)throw Error('Blob checksum mismatch');return b;}
          // Read the previously authored immutable manifest as text; never execute payload code.
          const prior=(await bytes('24304b3040c06cbd3069ab0c52e1d76968c83b69')).toString('utf8');
          const literal=prior.match(/const chunks=(\[[^\n]+\]);/)?.[1];
          if(!literal)throw Error('Missing immutable chunk list');
          const chunks=JSON.parse(literal.replaceAll("'",'"'));
          if(chunks.length!==26||chunks.some(x=>! /^[0-9a-f]{40}$/.test(x)))throw Error('Invalid chunks');
          const buffers=[];for(const sha of chunks)buffers.push(await bytes(sha));
          const compressed=Buffer.concat(buffers);
          if(compressed.length!==75550||createHash('sha256').update(compressed).digest('hex')!==expectedDigest)throw Error('Payload checksum mismatch');
          const payload=JSON.parse(gunzipSync(compressed,{maxOutputLength:1048576}).toString('utf8'));
          if(payload.schemaVersion!==1||payload.base!==expectedBase||!Array.isArray(payload.files)||payload.files.length!==124)throw Error('Payload schema mismatch');
          const parent=process.env.GITHUB_SHA;
          if((await api('git/ref/heads/main')).object.sha!==parent)throw Error('main advanced');
          const commit=await api(`git/commits/${parent}`);
          if(commit.parents.length!==1||commit.parents[0].sha!==expectedParent)throw Error('Unexpected delivery parent');
          const current=await api(`git/trees/${commit.tree.sha}?recursive=1`);if(current.truncated)throw Error('Incomplete tree');
          const entries=new Map(current.tree.map(e=>[e.path,e]));const seen=new Set();const tree=[];
          for(const f of payload.files){
            if(typeof f.path!=='string'||f.path.length>240||f.path.includes('\\')||f.path.includes('\0')||f.path.startsWith('/')||f.path.split('/').some(x=>!x||x==='.'||x==='..'||x==='.git')||seen.has(f.path)||!['100644','100755'].includes(f.mode))throw Error(`Invalid source path: ${f.path}`);
            seen.add(f.path);
            if((entries.get(f.path)?.sha??null)!==f.before)throw Error(`Concurrent change: ${f.path}`);
            if(f.content!==null&&(typeof f.content!=='string'||Buffer.byteLength(f.content)>524288))throw Error('Invalid content');
            const sha=f.content===null?null:(await api('git/blobs',{content:f.content,encoding:'utf-8'})).sha;
            tree.push({path:f.path,mode:f.mode,type:'blob',sha});
          }
          tree.push({path:'.github/workflows/source-delivery.yml',mode:'100644',type:'blob',sha:null});
          const receipt={schemaVersion:1,repository:repo,parent,baseTree:commit.tree.sha,payloadSha256:expectedDigest,message:payload.message,tree,branchMoved:false};
          writeFileSync('delivery-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify({parent,baseTree:commit.tree.sha,paths:tree.length,branchMoved:false}));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-source-delivery-receipt
          path: delivery-receipt.json
          if-no-files-found: error
          retention-days: 7
