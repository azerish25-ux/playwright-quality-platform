name: One-shot runner repair
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-runner.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Repair verified identifier and preserve all other source
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('packages/cli/src/runner.ts')
          text = source.read_text(encoding='utf-8')
          old = 'childEnvironment(requestPath,executionDi6)'
          new = 'childEnvironment(requestPath,executionDir)'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one verified typo, found {text.count(old)}')
          source.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/cli/src/runner.ts
          git commit -m 'fix: restore execution directory in native runner'
          git push origin HEAD:main
      - name: Retain credential-free tracked source for verification
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/forgeqa-source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forgeqa-repaired-source
          path: ${{ runner.temp }}/forgeqa-source.tar.gz
          if-no-files-found: error
          retention-days: 1
