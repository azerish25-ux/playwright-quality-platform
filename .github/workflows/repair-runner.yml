name: One-shot runner repair
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-runner.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Repair transported identifier and remove one-shot workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('packages/cli/src/runner.ts')
          text = source.read_text(encoding='utf-8')
          old = "resolve(executionDi6,'index.html')"
          new = "resolve(executionDir,'index.html')"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one transported typo, found {text.count(old)}')
          source.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/repair-runner.yml').unlink()
          PY
          git diff --check
          git diff --exit-code -- packages/cli/src/runner.ts || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/cli/src/runner.ts .github/workflows/repair-runner.yml
          git commit -m 'fix: repair benchmark runner report path'
          git push origin HEAD:main
