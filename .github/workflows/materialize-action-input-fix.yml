name: Materialize action input repair
# Branch-only compiler; removed after the repaired distribution is committed.
on:
  push:
    branches: [feature/github-platform-hardening]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Persist evidence for early action failures
        env:
          IMPORT_OLD: ICBzdGF0LAp9IGZyb20gJ25vZGU6ZnMvcHJvbWlzZXMnOw==
          IMPORT_NEW: ICBzdGF0LAogIHdyaXRlRmlsZSwKfSBmcm9tICdub2RlOmZzL3Byb21pc2VzJzs=
          BLOCK_OLD: 
          BLOCK_NEW: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('packages/github-action/src/main.ts')
          source = path.read_text()
          pairs = [
              (base64.b64decode(os.environ['IMPORT_OLD']).decode(), base64.b64decode(os.environ['IMPORT_NEW']).decode()),
              (base64.b64decode(os.environ['BLOCK_OLD']).decode(), base64.b64decode(os.environ['BLOCK_NEW']).decode()),
          ]
          for old, new in pairs:
              if source.count(old) != 1:
                  raise SystemExit('Expected one unpatched source block.')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
      - run: npm ci --ignore-scripts
      - run: npx --no-install tsc -b packages/github-action
      - run: node --test tests/github-action.test.mjs tests/distributed.test.mjs tests/github-workflow.test.mjs
      - name: Commit repaired source and exact distribution
        run: |
          git add packages/github-action/src/main.ts
          git add -f packages/github-action/dist/*.js packages/github-action/dist/*.d.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(action): honor runner inputs and retain failure evidence [skip ci]"
          git push
