name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '${{ matrix.node }}'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Stage exact-source package candidates
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: |
          mkdir -p candidate
          git archive --format=tar --output=candidate/source.tar HEAD
          for package in packages/*; do
            npm pack "./$package" --pack-destination candidate --ignore-scripts
          done
          git rev-parse HEAD > candidate/source-sha.txt
          sha256sum candidate/*.tgz candidate/source.tar > candidate/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        with:
          name: forgeqa-candidate-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 7
  forgeqa-quality:
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce aggregate result
        env: { VERIFY_RESULT: '${{ needs.verify.result }}' }
        run: |
          test "$VERIFY_RESULT" = success || { echo "verify matrix: $VERIFY_RESULT"; exit 1; }
