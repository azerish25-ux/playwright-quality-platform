name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
env:
  FORGEQA_SOURCE_SHA: ${{ github.sha }}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: '${{ matrix.node }}', package-manager-cache: false }
      - run: npm ci --ignore-scripts
      - name: Enforce dependency audit
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm audit --audit-level=high
      - run: npm run verify
      - run: npm run typecheck --workspace examples/demo-saas
      - name: Stage exact-source package candidates
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: |
          mkdir -p candidate
          git archive --format=tar --output=candidate/source.tar HEAD
          for package in packages/*; do
            npm pack "./$package" --pack-destination candidate --ignore-scripts
          done
          git rev-parse HEAD > candidate/source-sha.txt
          sha256sum candidate/*.tgz candidate/source.tar > candidate/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        with:
          name: forgeqa-candidate-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 7
  consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22, package-manager-cache: false }
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:consumers -- template
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: packed-consumer-${{ matrix.os }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
  teamboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: forgeqa_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: forgeqa-disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d forgeqa_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22, package-manager-cache: false }
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run build --workspace examples/demo-saas
      - name: Verify durable lost-runner PostgreSQL ownership
        run: node scripts/durable-postgres-acceptance.mjs
        env:
          DATABASE_URL: postgresql://postgres:forgeqa-disposable-ci-only@127.0.0.1:5432/forgeqa_test
          FORGEQA_ALLOW_ADAPTER_TEST: '1'
      - run: node scripts/prepare-teamboard-db.mjs
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:forgeqa-disposable-ci-only@127.0.0.1:5432/forgeqa_test
          FORGEQA_ALLOW_DB_SETUP: '1'
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Verify report UX on all three browser engines
        run: npm run test:report-browser
      - run: npm run test:teamboard
      - run: npm run test:consumers -- teamboard
      - name: Verify pinned pnpm workspace lock
        run: node node_modules/pnpm/bin/pnpm.cjs install --lockfile-only --frozen-lockfile --ignore-scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: teamboard-evidence-${{ github.sha }}
          path: |
            evidence/
            examples/demo-saas/forgeqa-results/
          if-no-files-found: error
          retention-days: 7
  ledgerguard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - name: Check out verified Bad Penny product source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: azerish25-ux/transaction-reliability-lab
          ref: d8d365690d961580d22105feb15ddec3267185ae
          path: .tmp/ledgerguard
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22, package-manager-cache: false }
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - run: npm run test:ledgerguard
        env:
          LEDGERGUARD_ROOT: ${{ github.workspace }}/.tmp/ledgerguard
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ledgerguard-evidence-${{ github.sha }}
          path: evidence/ledgerguard/
          if-no-files-found: error
          retention-days: 14
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22, package-manager-cache: false }
      - run: npm ci --ignore-scripts
      - name: Initialize hardening evidence
        run: |
          mkdir -p evidence/hardening
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          await writeFile('evidence/hardening/run.json', `${JSON.stringify({ schemaVersion: 1, kind: 'forgeqa-hardening-run', sourceSha: process.env.FORGEQA_SOURCE_SHA, startedAt: new Date().toISOString() }, null, 2)}\n`);
          NODE
      - run: npm run hardening
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hardening-evidence-${{ github.sha }}
          path: evidence/hardening/
          if-no-files-found: error
          retention-days: 14
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 24, package-manager-cache: false }
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/prepare-action-consumer.mjs
      - id: forgeqa
        uses: ./
        with:
          working-directory: .tmp/action-consumer
          cli-path: packages/cli/dist/cli.js
          install-dependencies: 'false'
          browser-install: none
          workers: '2'
          shard-count: '2'
          max-local-shards: '2'
          reporting-mode: summary
      - name: Verify action outputs and callable distribution
        env:
          OUTCOME: ${{ steps.forgeqa.outputs.outcome }}
          TEST_COUNT: ${{ steps.forgeqa.outputs.test-count }}
          ATTEMPT_COUNT: ${{ steps.forgeqa.outputs.attempt-count }}
          REPORT_PATH: ${{ steps.forgeqa.outputs.report-path }}
        run: |
          test "$OUTCOME" = success
          test "$TEST_COUNT" = 2
          test "$ATTEMPT_COUNT" = 2
          test -f "$REPORT_PATH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ${{ steps.forgeqa.outputs.artifact-name }}
          path: ${{ steps.forgeqa.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 7
  forgeqa-quality:
    if: always()
    needs: [verify, consumer, teamboard, ledgerguard, hardening, action]
    runs-on: ubuntu-latest
    steps:
      - id: enforce
        name: Enforce all required lanes
        env:
          VERIFY_RESULT: '${{ needs.verify.result }}'
          CONSUMER_RESULT: '${{ needs.consumer.result }}'
          TEAMBOARD_RESULT: '${{ needs.teamboard.result }}'
          LEDGERGUARD_RESULT: '${{ needs.ledgerguard.result }}'
          HARDENING_RESULT: '${{ needs.hardening.result }}'
          ACTION_RESULT: '${{ needs.action.result }}'
        run: |
          test "$VERIFY_RESULT" = success
          test "$CONSUMER_RESULT" = success
          test "$TEAMBOARD_RESULT" = success
          test "$LEDGERGUARD_RESULT" = success
          test "$HARDENING_RESULT" = success
          test "$ACTION_RESULT" = success
      - name: Materialize data-only PR report
        if: always() && github.event_name == 'pull_request'
        env:
          REPORT_REPOSITORY: ${{ github.repository }}
          REPORT_WORKFLOW: ${{ github.workflow }}
          REPORT_RUN_ID: ${{ github.run_id }}
          REPORT_RUN_ATTEMPT: ${{ github.run_attempt }}
          REPORT_PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPORT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPORT_TESTED_SHA: ${{ github.sha }}
          REPORT_VERIFY_RESULT: ${{ needs.verify.result }}
          REPORT_CONSUMER_RESULT: ${{ needs.consumer.result }}
          REPORT_TEAMBOARD_RESULT: ${{ needs.teamboard.result }}
          REPORT_LEDGERGUARD_RESULT: ${{ needs.ledgerguard.result }}
          REPORT_HARDENING_RESULT: ${{ needs.hardening.result }}
          REPORT_ACTION_RESULT: ${{ needs.action.result }}
          REPORT_GATE_OUTCOME: ${{ steps.enforce.outcome }}
        run: |
          mkdir -p .forgeqa-pr-report
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const required = (name) => {
            const value = process.env[name];
            if (!value) throw new Error(`Missing ${name}.`);
            return value;
          };
          const integer = (name) => {
            const value = Number(required(name));
            if (!Number.isSafeInteger(value) || value < 1) throw new Error(`Invalid ${name}.`);
            return value;
          };
          const report = {
            schemaVersion: 3,
            kind: 'forgeqa-pr-report',
            repository: required('REPORT_REPOSITORY'),
            workflow: required('REPORT_WORKFLOW'),
            workflowPath: '.github/workflows/ci.yml',
            runId: integer('REPORT_RUN_ID'),
            runAttempt: integer('REPORT_RUN_ATTEMPT'),
            pullRequestNumber: integer('REPORT_PR_NUMBER'),
            pullRequestHeadSha: required('REPORT_HEAD_SHA'),
            pullRequestBaseSha: required('REPORT_BASE_SHA'),
            sourceHeadSha: required('REPORT_HEAD_SHA'),
            testedSha: required('REPORT_TESTED_SHA'),
            aggregate: {
              verify: required('REPORT_VERIFY_RESULT'),
              consumer: required('REPORT_CONSUMER_RESULT'),
              teamboard: required('REPORT_TEAMBOARD_RESULT'),
              ledgerguard: required('REPORT_LEDGERGUARD_RESULT'),
              hardening: required('REPORT_HARDENING_RESULT'),
              action: required('REPORT_ACTION_RESULT'),
              gateStep: required('REPORT_GATE_OUTCOME'),
            },
            generatedAt: new Date().toISOString(),
          };
          await writeFile('.forgeqa-pr-report/forgeqa-pr-report.json', `${JSON.stringify(report, null, 2)}\n`, { encoding: 'utf8', mode: 0o600 });
          NODE
      - name: Upload data-only PR report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forgeqa-pr-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .forgeqa-pr-report/forgeqa-pr-report.json
          if-no-files-found: error
          retention-days: 7
